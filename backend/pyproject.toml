[project]
name = "pollso"
version = "0.1.0"
description = "Privacy-friendly, self-hosted real-time audience polling tool. Run interactive presentations in your local network without cloud lock-in."
authors = [
    {name = "KKQUEN",email = "artem_r2015@mail.ru"}
]
license = "AGPL-3.0 license"
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "channels (>=4.3.2,<5.0.0)",
    "daphne (>=4.2.3,<5.0.0)",
    "channels-redis (>=4.3.0,<5.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "django-prometheus (>=2.5.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "django-debug-toolbar (>=8.0.0,<9.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "bandit[toml] (>=1.9.4,<2.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "S"]
ignore = ["DJ001"]

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = ["B101"]